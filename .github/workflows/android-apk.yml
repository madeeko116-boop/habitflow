name: Android APK Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Release tag name (defaults to 'latest')"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build Release & Debug APKs
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Accept Android SDK licenses
        run: |
          if [ -n "${ANDROID_HOME:-}" ] && [ -d "$ANDROID_HOME/cmdline-tools/latest/bin" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null 2>&1 || true
          fi

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Build Signed Release APK
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HabitFlow-debug.apk

          RELEASE_KEYSTORE="${{ runner.temp }}/my-upload-key.jks"
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RELEASE_KEYSTORE"
            export KEYSTORE_PATH="$RELEASE_KEYSTORE"
          else
            echo "Signing secrets not configured; generating temporary CI upload key for release APK."
            export KEYSTORE_PATH="$RELEASE_KEYSTORE"
            export STORE_PASSWORD="ci-release-store-password"
            export KEY_PASSWORD="ci-release-key-password"
            keytool -genkeypair -v \
              -keystore "$KEYSTORE_PATH" \
              -storepass "$STORE_PASSWORD" \
              -alias upload \
              -keypass "$KEY_PASSWORD" \
              -keyalg RSA \
              -keysize 2048 \
              -validity 10000 \
              -dname "CN=HabitFlow,O=HabitFlow,C=US"
          fi

          gradle :app:assembleRelease --no-daemon
          cp app/build/outputs/apk/release/app-release.apk dist/HabitFlow-release.apk

      - name: Upload APK build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-APKs
          path: dist/*.apk

      - name: Publish APKs to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'latest') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('HabitFlow {0}', github.ref_name) || 'HabitFlow Latest Release' }}
          body: |
            Automated Android APK build for **HabitFlow** (`com.aistudio.habitflow.zqvxm`).

            - **HabitFlow-release.apk**: Release build APK ready to download and install on Android 7.0+ (API 24+) devices.
            - **HabitFlow-debug.apk**: Debug build APK signed with the repository's consistent debug keystore.
          files: |
            dist/HabitFlow-release.apk
            dist/HabitFlow-debug.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
