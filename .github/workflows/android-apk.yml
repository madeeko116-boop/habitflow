name: Android APK Build & Release

on:
  push:
    branches:
      - main
      - master
    tags:
      - "v*"
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Optional release tag (defaults to 'latest')"
        required: false
        default: "latest"

permissions:
  contents: write

jobs:
  build-apk:
    name: Build, Test & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"

      - name: Restore debug keystore
        run: |
          if [ ! -f debug.keystore ]; then
            if [ -f debug.keystore.base64 ]; then
              base64 -d debug.keystore.base64 > debug.keystore
            else
              keytool -genkeypair -v \
                -keystore debug.keystore \
                -storepass android \
                -alias androiddebugkey \
                -keypass android \
                -keyalg RSA \
                -keysize 2048 \
                -validity 10000 \
                -dname "CN=Android Debug,O=Android,C=US"
            fi
          fi

      - name: Run unit tests
        run: gradle :app:testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: gradle :app:assembleDebug --no-daemon

      - name: Prepare Debug APK for distribution
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/debug/app-debug.apk dist/HabitFlow-debug.apk

      - name: Build Signed Release APK (if signing secrets are configured)
        id: release_apk
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ] && [ -n "$STORE_PASSWORD" ] && [ -n "$KEY_PASSWORD" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "${{ runner.temp }}/my-upload-key.jks"
            export KEYSTORE_PATH="${{ runner.temp }}/my-upload-key.jks"
            gradle :app:assembleRelease --no-daemon
            cp app/build/outputs/apk/release/app-release.apk dist/HabitFlow-release.apk
            echo "built=true" >> "$GITHUB_OUTPUT"
          else
            echo "Signing secrets (KEYSTORE_BASE64, STORE_PASSWORD, KEY_PASSWORD) not set; skipping release APK."
            echo "built=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Upload Debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-debug-apk
          path: dist/HabitFlow-debug.apk

      - name: Upload Signed Release APK artifact
        if: steps.release_apk.outputs.built == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: HabitFlow-release-apk
          path: dist/HabitFlow-release.apk

      - name: Publish APK to GitHub Releases
        if: github.event_name != 'pull_request'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || (github.event.inputs.release_tag != '' && github.event.inputs.release_tag || 'latest') }}
          name: ${{ startsWith(github.ref, 'refs/tags/') && format('HabitFlow {0}', github.ref_name) || 'HabitFlow Latest Build' }}
          body: |
            Automated Android APK build for **HabitFlow** (`com.aistudio.habitflow.zqvxm`).

            - Download `HabitFlow-release.apk` (when release signing secrets are configured) or `HabitFlow-debug.apk` below to install directly on Android devices (Android 7.0+ / API 24+).
          files: dist/*.apk
          prerelease: ${{ !startsWith(github.ref, 'refs/tags/') }}
          make_latest: ${{ startsWith(github.ref, 'refs/tags/') && 'true' || 'false' }}
